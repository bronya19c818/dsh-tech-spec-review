[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technical-spec-review"
version = "0.1.0"
description = "Program-controlled technical specification review with auditable rule bindings"
requires-python = ">=3.12"
dependencies = [
  "python-docx>=1.1,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "mcp>=1.12,<2",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
ts-review = "technical_spec_review.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9", "mypy>=1.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["workspace", "registry"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["legacy_compilers"]

[tool.hatch.build.targets.wheel]
packages = ["py/technical_spec_review"]

[tool.hatch.build.targets.sdist]
only-include = [
  "py", "src", "tests", "docs", "locale",
  "pyproject.toml", "README.md", "requirements.txt", "cordis.patch.yml",
  "icon.svg", ".env.example", ".gitignore",
]
